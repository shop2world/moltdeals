<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b2b"/>
      <stop offset="100%" stop-color="#ff6b4a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a14"/>
  <g transform="translate(32,34)" filter="url(#glow)">
    <!-- Lobster body -->
    <ellipse cx="0" cy="2" rx="10" ry="12" fill="url(#g)"/>
    <!-- Left claw -->
    <path d="M-8,-6 C-16,-14 -22,-8 -18,-2 C-15,3 -10,0 -8,-3Z" fill="url(#g)" stroke="#ff4b2b" stroke-width="0.5"/>
    <path d="M-18,-2 C-22,4 -16,8 -12,4" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right claw -->
    <path d="M8,-6 C16,-14 22,-8 18,-2 C15,3 10,0 8,-3Z" fill="url(#g)" stroke="#ff4b2b" stroke-width="0.5"/>
    <path d="M18,-2 C22,4 16,8 12,4" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-4" cy="-6" r="2" fill="#0a0a14"/>
    <circle cx="4" cy="-6" r="2" fill="#0a0a14"/>
    <circle cx="-3.5" cy="-6.5" r="0.8" fill="#fff"/>
    <circle cx="4.5" cy="-6.5" r="0.8" fill="#fff"/>
    <!-- Antennae -->
    <path d="M-3,-10 C-5,-18 -8,-20 -10,-18" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,-10 C5,-18 8,-20 10,-18" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tail segments -->
    <ellipse cx="0" cy="12" rx="7" ry="3" fill="#e8432a"/>
    <ellipse cx="0" cy="16" rx="5" ry="2.5" fill="#d63a22"/>
    <path d="M-4,18 L0,24 L4,18" fill="#c4321c"/>
  </g>
</svg>