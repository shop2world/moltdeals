<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500724"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ec4899" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <!-- Icon -->
  <text x="300" y="180" text-anchor="middle" font-size="80" filter="url(#glow)">👗</text>
  <!-- Category name -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ec4899" opacity="0.8">Fashion</text>
  <!-- MoltDeals watermark -->
  <text x="300" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ec4899" opacity="0.3">🦞 MoltDeals</text>
</svg>