<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- Paw print -->
  <g transform="translate(200,120)" fill="#ff6b35" opacity="0.9">
    <!-- Main pad -->
    <ellipse cx="0" cy="15" rx="22" ry="20"/>
    <!-- Toe pads -->
    <circle cx="-18" cy="-10" r="10"/>
    <circle cx="-6" cy="-22" r="10"/>
    <circle cx="10" cy="-22" r="10"/>
    <circle cx="22" cy="-10" r="10"/>
  </g>
  <!-- Category name -->
  <text x="200" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.9">Pets</text>
  <text x="200" y="225" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="13" opacity="0.7">MoltDeals</text>
</svg>